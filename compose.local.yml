# W0-03: Local production-like integration stack.
# STRICTLY LOCAL: all services bind to 127.0.0.1 only.
# Never described as production. Never exposes ports to the internet.
#
# Usage:
#   docker compose -f compose.local.yml up -d
#   docker compose -f compose.local.yml ps
#   docker compose -f compose.local.yml down -v

name: markflow-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: markflow-local-pg
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: markflow
      POSTGRES_PASSWORD: "${LOCAL_PG_PASSWORD}"
      POSTGRES_DB: markflow_local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markflow -d markflow_local"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - local

  minio:
    image: minio/minio:latest
    container_name: markflow-local-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: "${LOCAL_MINIO_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${LOCAL_MINIO_SECRET_KEY}"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - local

  openbao:
    image: openbao/openbao:latest
    container_name: markflow-local-openbao
    restart: unless-stopped
    user: root # local dev only — volume owned by root
    cap_add:
      - IPC_LOCK
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      BAO_DEV_ROOT_TOKEN_FILE: /bao/data/dev-root-token
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - ./infra/local/openbao/config.hcl:/bao/config/config.hcl:ro
      - openbao-data:/bao/data
    healthcheck:
      test: ["CMD-SHELL", "BAO_ADDR=http://127.0.0.1:8200 bao status"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - local

  # One-shot: init + unseal + kv-v2. Runs on every up -d, idempotent.
  openbao-init:
    image: openbao/openbao:latest
    container_name: markflow-local-openbao-init
    depends_on:
      openbao:
        condition: service_healthy
    environment:
      BAO_ADDR: http://openbao:8200
    volumes:
      - ./scripts/local-openbao-bootstrap.sh:/init.sh:ro
      - openbao-data:/bao/data
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"
    networks:
      - local

volumes:
  pgdata:
  miniodata:
  openbao-data:

networks:
  local:
    driver: bridge
    internal: true # W0-03: no outbound internet from services
