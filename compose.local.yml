# W0-03: Local production-like integration stack.
# STRICTLY LOCAL: all services bind to 127.0.0.1 only.
# Never described as production. Never exposes ports to the internet.
#
# Usage:
#   docker compose -f compose.local.yml --env-file .env.local up -d
#   docker compose -f compose.local.yml --env-file .env.local ps
#   docker compose -f compose.local.yml --env-file .env.local down -v
#
# Image digests (pinned for reproducibility):
#   postgres:16-alpine      sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
#   minio/minio:latest      sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
#   openbao/openbao:latest  sha256:11fd73a2102cda9c55d5d881a8c3210303146a7ec1e8ac76f526e175c6d24641

name: markflow-local

services:
  postgres:
    image: docker.io/library/postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: markflow-local-pg
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: markflow
      POSTGRES_PASSWORD: "${LOCAL_PG_PASSWORD}"
      POSTGRES_DB: markflow_local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markflow -d markflow_local"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - local

  minio:
    image: docker.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: markflow-local-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: "${LOCAL_MINIO_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${LOCAL_MINIO_SECRET_KEY}"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - local

  openbao:
    image: docker.io/openbao/openbao@sha256:11fd73a2102cda9c55d5d881a8c3210303146a7ec1e8ac76f526e175c6d24641
    container_name: markflow-local-openbao
    restart: unless-stopped
    user: root # local dev only — volume owned by root
    cap_add:
      - IPC_LOCK
    # W0-03-fix: -dev mode auto-inits and unseals; no config.hcl needed.
    # -dev-root-token-id sets a known root token (generated in .env.local).
    # The root token is never printed to stdout; only used by bootstrap to create a limited dev token.
    # Persistence: named volume (openbao-data) survives up/down; removed by down -v or reset.
    command:
      [
        "server",
        "-dev",
        "-dev-listen-address=0.0.0.0:8200",
        "-dev-root-token-id=${LOCAL_OPENBAO_ROOT_TOKEN}",
      ]
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - openbao-data:/bao/data
    healthcheck:
      test: ["CMD-SHELL", "BAO_ADDR=http://127.0.0.1:8200 bao status"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - local

volumes:
  pgdata:
  miniodata:
  openbao-data:

networks:
  local:
    driver: bridge
    internal: true # W0-03: no outbound internet from services
