name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: markflow
          POSTGRES_PASSWORD: markflow
          POSTGRES_DB: markflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://markflow:markflow@localhost:5432/markflow_test
      DATABASE_URL: postgresql://markflow:markflow@localhost:5432/markflow_test
      NODE_ENV: test
      JWT_SECRET: test-secret-for-ci-pipeline-only-20-chars
      ADAPTERS_MPT: mock
      ADAPTERS_GS1: mock
      ADAPTERS_NKT: mock
      ADAPTERS_1ECOM: mock
      KMS_PROFILE: file
      STORAGE_DIR: /tmp/markflow-storage
      MPT_BASE_URL: https://httpbin.org
      MPT_LOGIN: test
      MPT_PASSWORD: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # W0-02R: ONE canonical Prisma client (PostgreSQL). No second provider
      # client is generated, so the generate/test overwrite blocker is gone.
      - name: Generate Prisma client (PostgreSQL)
        run: npm run db:generate

      - name: Build shared
        run: npm run build:cjs --workspace @markflow/shared

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Secret scan
        run: npm run secret-scan

      # Self-contained migration validation on a disposable PG resource:
      # deploy + status + capability assertion + cleanup.
      - name: Validate PG migration chain
        run: npm run db:validate

      # All integration/API tests run against disposable PG (isolated schemas
      # created by the shared test harness from TEST_DATABASE_URL).
      - name: Run tests
        run: npm test

      # Strict dependency audit — fail closed on high/critical that are NOT in
      # the documented exception register (scripts/audit-exceptions.json).
      # Never use `|| true`.
      - name: Dependency audit
        run: node scripts/audit-policy.mjs
